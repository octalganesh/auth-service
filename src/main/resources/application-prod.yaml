server:
  port: 8086
  error:
    include-stacktrace: never

spring:
  application:
    name: auth-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect



  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialize: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  fetch-registry: true
  instance:
    prefer-ip-address: true
#    instance-id: ${EUREKA_INSTANCE_IP}:${spring.application.name}:${server.port}
#    ip-address: ${EUREKA_INSTANCE_IP:${spring.cloud.client.ip-address}}


jwt:
  access:
    token:
      validity: 7776000
  refresh:
    token:
      validity: 7776000
  secret: fsm


springdoc:
  api-docs.path : /api-docs
  swagger-ui.path : /swagger-ui.html

